<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ContextPassport AI</title>
    <link rel="stylesheet" href="tokens.css" />
  </head>
  <body class="cp-popup">
    <header class="cp-header">
      <h1>ContextPassport</h1>
      <span id="cp-provider" class="cp-badge">detecting…</span>
    </header>

    <section class="cp-section">
      <label class="cp-label" for="cp-project">Active project</label>
      <div class="cp-row">
        <select id="cp-project" class="cp-select"></select>
        <button id="cp-new-project" class="cp-btn cp-btn-icon" title="New project">+</button>
      </div>
      <p id="cp-passport-stats" class="cp-muted"></p>
      <div class="cp-row" id="cp-health-row">
        <span id="cp-health-badge" class="cp-badge" data-state="idle">Health —</span>
        <span id="cp-health-type" class="cp-muted"></span>
      </div>
      <ul id="cp-health-recs" class="cp-recs"></ul>
    </section>

    <section class="cp-section">
      <button id="cp-capture" class="cp-btn cp-btn-primary">Capture this conversation → project</button>
      <p id="cp-capture-status" class="cp-muted"></p>
    </section>

    <section class="cp-section">
      <label class="cp-label" for="cp-mode">Continuity render</label>
      <select id="cp-mode" class="cp-select"></select>
      <p id="cp-mode-desc" class="cp-muted"></p>
      <button id="cp-inject" class="cp-btn">Render passport → inject into current tab</button>
      <p id="cp-inject-status" class="cp-muted"></p>
    </section>

    <footer class="cp-footer">
      <a href="#" id="cp-options">Manage projects, memory & passport</a>
      <span class="cp-muted">v0.3.0 · local-only</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
